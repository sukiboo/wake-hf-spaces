name: wake-hf-spaces

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install requests pyyaml
      - run: python wake.py
